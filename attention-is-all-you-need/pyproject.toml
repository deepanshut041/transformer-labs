[project]
name = "attention-is-all-you-need"
version = "0.1.0"
description = "English-to-French Transformer following Priyam Mazumdar’s three-video series"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["torch>=2.5,<3", "numpy>=2,<3"]

[project.optional-dependencies]
notebook = ["jupyterlab>=4,<5", "ipykernel>=6,<8", "nbclient>=0.10,<1", "matplotlib>=3.9,<4", "ipywidgets>=8,<9"]
video = [
  "tokenizers",
  "transformers",
  "datasets",
  "accelerate",
  "tqdm",
  "evaluate",
  "sacrebleu",
]

[project.scripts]
attention-demo = "attention:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src"]
sources = ["src"]

[tool.hatch.build.targets.sdist]
include = ["src", "notebooks", "tests", "configs", "README.md", "LICENSE", "pyproject.toml", "uv.lock", ".python-version", ".gitignore", ".ai-project.toml", "docs/SOURCES.md", "docs/COLAB.md", "docs/sources.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
